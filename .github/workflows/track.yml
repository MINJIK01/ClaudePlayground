name: arXiv tracker
on:
  schedule:
    - cron: "23 2 * * 1-5"  # 평일 02:23 UTC (11:23 KST), arXiv 공지 이후
  workflow_dispatch:
    inputs:
      days:
        description: "lookback days (백필용)"
        default: "3"
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: python tracker.py ${{ inputs.days }}
      - run: python graph.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add papers docs data
          git diff --cached --quiet || (git commit -m "papers: $(date -u +%F)" && git push)
